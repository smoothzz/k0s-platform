---
- name: Determine the Envoy release asset architecture
  ansible.builtin.set_fact:
    k0s_envoy_arch: >-
      {{ 'aarch_64' if ansible_architecture in ['aarch64', 'arm64'] else 'x86_64' }}

- name: Resolve the latest Envoy release
  ansible.builtin.uri:
    url: https://api.github.com/repos/envoyproxy/envoy/releases/latest
    return_content: true
    headers:
      Accept: application/vnd.github+json
      User-Agent: k0s-platform
  register: k0s_envoy_release
  run_once: true
  delegate_to: localhost
  become: false
  when: k0s_lb_envoy_version == 'latest'

- name: Determine the Envoy version to install
  ansible.builtin.set_fact:
    k0s_envoy_version: >-
      {{
        (k0s_envoy_release.json.tag_name | regex_replace('^v', ''))
        if k0s_lb_envoy_version == 'latest'
        else k0s_lb_envoy_version
      }}

- name: Check for an existing Envoy binary
  ansible.builtin.command: "{{ k0s_lb_envoy_binary }} --version"
  register: k0s_envoy_installed
  changed_when: false
  failed_when: false

- name: Download Envoy {{ k0s_envoy_version }}
  ansible.builtin.get_url:
    url: "https://github.com/envoyproxy/envoy/releases/download/v{{ k0s_envoy_version }}/envoy-{{ k0s_envoy_version }}-linux-{{ k0s_envoy_arch }}"
    dest: "{{ k0s_lb_envoy_binary }}"
    owner: root
    group: root
    mode: "0755"
  when: >-
    k0s_envoy_installed.rc != 0
    or k0s_envoy_version not in k0s_envoy_installed.stdout

- name: Ensure the Envoy config directory exists
  ansible.builtin.file:
    path: "{{ k0s_lb_envoy_config_dir }}"
    state: directory
    mode: "0755"

- name: Deploy the Envoy configuration
  ansible.builtin.template:
    src: envoy.yaml.j2
    dest: "{{ k0s_lb_envoy_config_dir }}/envoy.yaml"
    mode: "0644"
    validate: "{{ k0s_lb_envoy_binary }} --mode validate -c %s"
  notify: Restart Envoy

- name: Deploy the Envoy systemd unit
  ansible.builtin.template:
    src: envoy.service.j2
    dest: /etc/systemd/system/envoy.service
    mode: "0644"
  notify: Restart Envoy

- name: Enable and start Envoy
  ansible.builtin.systemd:
    name: envoy
    state: started
    enabled: true
    daemon_reload: true
