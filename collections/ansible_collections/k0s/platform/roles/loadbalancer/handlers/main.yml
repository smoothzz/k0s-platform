---
- name: Restart HAProxy
  ansible.builtin.service:
    name: haproxy
    state: restarted

- name: Restart Envoy
  ansible.builtin.systemd:
    name: envoy
    state: restarted
    daemon_reload: true

- name: Restart keepalived
  ansible.builtin.service:
    name: keepalived
    state: restarted
