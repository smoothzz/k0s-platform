---
- name: restart haproxy
  ansible.builtin.service:
    name: haproxy
    state: restarted

- name: restart envoy
  ansible.builtin.systemd:
    name: envoy
    state: restarted
    daemon_reload: true

- name: restart keepalived
  ansible.builtin.service:
    name: keepalived
    state: restarted
