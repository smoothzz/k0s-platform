---
- name: Check whether the controller service is already installed
  ansible.builtin.stat:
    path: /etc/systemd/system/k0scontroller.service
  register: k0s_controller_service

- name: (Re)install and start the controller service
  when: not k0s_controller_service.stat.exists or k0s_controller_config.changed
  block:
    - name: Stop k0s before reconfiguring
      ansible.builtin.command: k0s stop
      failed_when: false
      changed_when: false

    - name: Install controller service (single-node mode)
      ansible.builtin.command: >-
        k0s install controller
        --config /etc/k0s/k0s.yaml
        --single
        {{ k0s_controller_extra_args }}
        --force
      when: not (k0s_ha | bool)
      changed_when: true

    - name: Install controller service (HA mode)
      ansible.builtin.command: >-
        k0s install controller
        --config /etc/k0s/k0s.yaml
        {{ '--enable-worker' if k0s_controller_enable_worker | bool else '' }}
        {{ k0s_controller_extra_args }}
        --force
      when: k0s_ha | bool
      changed_when: true

    - name: Start k0s
      ansible.builtin.command: k0s start
      changed_when: true

- name: Wait for the controller process to be up
  ansible.builtin.command: k0s status
  register: k0s_controller_status
  until: "'Role: controller' in k0s_controller_status.stdout"
  retries: 30
  delay: 5
  changed_when: false

- name: Wait for the Kubernetes API to answer
  ansible.builtin.command: k0s kubectl get --raw=/healthz
  register: k0s_healthz
  until: k0s_healthz.stdout is search('ok')
  retries: 60
  delay: 5
  changed_when: false
