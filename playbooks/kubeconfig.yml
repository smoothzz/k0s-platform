---
# Fetch the admin kubeconfig from the primary controller and store it locally.
#   ansible-playbook playbooks/kubeconfig.yml
- name: Build the cluster inventory
  import_playbook: _inventory.yml

- name: Fetch the cluster kubeconfig
  hosts: k0s_controllers
  become: true
  vars:
    k0s_kubeconfig_local_path: "{{ lookup('env', 'HOME') }}/.kube/config"
    k0s_kubeconfig_server: "{{ k0s_lb_vip if (k0s_ha | bool) else ansible_host }}"
  tasks:
    - name: Fetch the admin kubeconfig from the primary controller
      when: inventory_hostname == groups['k0s_controllers'][0]
      block:
        - name: Read the admin kubeconfig
          ansible.builtin.slurp:
            src: /var/lib/k0s/pki/admin.conf
          register: k0s_admin_conf

        - name: Save the kubeconfig locally
          ansible.builtin.copy:
            content: >-
              {{ k0s_admin_conf.content | b64decode
                 | regex_replace('https://[0-9a-zA-Z_.-]+:6443',
                                 'https://' ~ k0s_kubeconfig_server ~ ':6443') }}
            dest: "{{ k0s_kubeconfig_local_path }}"
            mode: "0600"
          delegate_to: localhost
          become: false
