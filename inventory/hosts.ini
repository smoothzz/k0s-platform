# =============================================================================
#  Static inventory (optional)
#
#  By default you define nodes as lists in inventory/group_vars/all.yml:
#      k0s_controllers_hosts / k0s_workers_hosts / k0s_lb_hosts
#  playbooks/site.yml adds them to the groups below at runtime.
#
#  The empty group stubs let the plays target the groups even when no static
#  hosts are listed. You may also list hosts here instead of / in addition to
#  the group_vars lists (matching names are merged, not duplicated). Vars live
#  in inventory/group_vars/ so Ansible picks them up alongside this file.
# =============================================================================

[k0s_controllers]

[k0s_workers]

[k0s_lb]

# Everything that runs the k0s binary (prerequisites are applied here).
[k0s_cluster:children]
k0s_controllers
k0s_workers
